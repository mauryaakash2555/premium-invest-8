<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#DAA520" />
        <meta name="description" content="Mumbai's Premier Financial Partner - Expert Investment Advisory" />
        <meta name="google-site-verification" content="Ndk6OylwmzDA4pWL6KPNw0mkKS8WQnO-lGaWb5cpyJ0" />
        
        <!-- Preconnect to external domains for faster loading -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
        <link rel="dns-prefetch" href="https://images.pexels.com" />
        
        <!-- Preload critical assets for LCP improvement -->
        <link rel="preload" href="/logo.webp" as="image" type="image/webp" fetchpriority="high" />
        
        <!-- Google Fonts with font-display: swap and only used weights -->
        <link rel="preload" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" as="style" />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
        <noscript>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" />
        </noscript>
        
        <!-- Favicons -->
        <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
        <link rel="icon" type="image/webp" sizes="192x192" href="%PUBLIC_URL%/android-chrome-192x192.webp" />

        <link rel="apple-touch-icon" type="image/png" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
        
        <title>BM Wealth - Mumbai's Premier Financial Partner</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        
        <!-- Defer Google Analytics to load after page is interactive -->
        <script>
          // Load Google Analytics after page is interactive
          if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
              loadGoogleAnalytics();
            });
          } else {
            setTimeout(function() {
              loadGoogleAnalytics();
            }, 2000);
          }
          
          function loadGoogleAnalytics() {
            var script = document.createElement('script');
            script.async = true;
            script.src = 'https://www.googletagmanager.com/gtag/js?id=G-SSN64C0XCY';
            document.head.appendChild(script);
            
            script.onload = function() {
              window.dataLayer = window.dataLayer || [];
              function gtag(){dataLayer.push(arguments);}
              gtag('js', new Date());
              gtag('config', 'G-SSN64C0XCY');
            };
          }
        </script>
    </body>
</html>
