<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <!-- Dark background -->
  <rect width="1200" height="400" fill="#0a0a0a"/>
  
  <!-- Grid pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1a1a" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid)"/>
  
  <!-- Chart elements -->
  <g transform="translate(100, 100)">
    <!-- Candlestick chart -->
    <line x1="0" y1="0" x2="0" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="0" y1="200" x2="400" y2="200" stroke="#333" stroke-width="2"/>
    
    <!-- Bars -->
    <rect x="50" y="120" width="30" height="80" fill="#DAA520" opacity="0.7"/>
    <rect x="120" y="80" width="30" height="120" fill="#DAA520" opacity="0.8"/>
    <rect x="190" y="100" width="30" height="100" fill="#DAA520" opacity="0.6"/>
    <rect x="260" y="60" width="30" height="140" fill="#DAA520" opacity="0.9"/>
    <rect x="330" y="90" width="30" height="110" fill="#DAA520" opacity="0.7"/>
  </g>
  
  <!-- Line chart -->
  <g transform="translate(550, 100)">
    <polyline points="0,150 80,120 160,90 240,70 320,50 400,40" 
              fill="none" stroke="#DAA520" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="150" r="4" fill="#DAA520"/>
    <circle cx="80" cy="120" r="4" fill="#DAA520"/>
    <circle cx="160" cy="90" r="4" fill="#DAA520"/>
    <circle cx="240" cy="70" r="4" fill="#DAA520"/>
    <circle cx="320" cy="50" r="4" fill="#DAA520"/>
    <circle cx="400" cy="40" r="4" fill="#DAA520"/>
  </g>
  
  <!-- Title text -->
  <text x="600" y="330" font-family="Arial, sans-serif" font-size="32" fill="#DAA520" text-anchor="middle" font-weight="bold">
    Finance Dashboard Analysis
  </text>
  <text x="600" y="365" font-family="Arial, sans-serif" font-size="18" fill="#999" text-anchor="middle">
    BM Wealth Case Study — Investment Performance Tracking
  </text>
  
  <!-- TODO comment in SVG comment -->
  <!-- TODO: Replace with licensed finance dashboard hero image -->
</svg>
