<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="760" viewBox="0 0 1100 760">
  <defs>
    <style>
      .bg { fill: #0b0b0c; }
      .card { fill: rgba(255,255,255,0.06); stroke: rgba(255,255,255,0.10); stroke-width: 2; }
      .t { fill: rgba(255,255,255,0.92); font-family: Consolas, monospace; font-size: 18px; }
      .h { fill: #C6A15B; font-family: Arial, sans-serif; font-size: 28px; font-weight: 900; }
      .sub { fill: rgba(255,255,255,0.70); font-family: Arial, sans-serif; font-size: 14px; }
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1100" height="760"/>
  <rect class="card" x="60" y="60" rx="20" ry="20" width="980" height="640"/>
  <text class="h" x="100" y="115">Screenshot 1: File Structure (Simple Map)</text>
  <text class="sub" x="100" y="142">This is a “picture” of the folder tree (like VS Code file explorer).</text>

  <text class="t" x="100" y="190">📁 app/</text>
  <text class="t" x="140" y="220">📁 api/</text>
  <text class="t" x="180" y="250">📁 chat/ → 📄 route.js (user messages)</text>
  <text class="t" x="180" y="280">📁 leads/ → 📄 route.js (save name/email/phone)</text>
  <text class="t" x="180" y="310">📁 admin/ → 📁 summary/analytics/revenue/strategy</text>
  <text class="t" x="140" y="340">📁 (public)/ → 📄 page.jsx (homepage)</text>
  <text class="t" x="140" y="370">📁 admin-secret-xyz/ → 📄 page.jsx (hidden admin page)</text>

  <text class="t" x="100" y="420">📁 components/</text>
  <text class="t" x="140" y="450">📁 user/ → 💬 AIChatFloat.jsx (chat UI)</text>
  <text class="t" x="140" y="480">📁 admin/ → 🎛️ AdminDashboard.jsx (admin UI)</text>
  <text class="t" x="140" y="510">📁 shared/ → reusable UI (used by both)</text>

  <text class="t" x="100" y="560">📁 lib/</text>
  <text class="t" x="140" y="590">📁 ai/ → gemini.js / groq.js / claude.js / provider.js</text>
  <text class="t" x="140" y="620">📁 db/ → leads.js / conversations.js / events.js</text>
  <text class="t" x="140" y="650">📁 utils/ → rateLimiter.js / validator.js / logger.js</text>
</svg>






